<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>South Boat — Location de bateaux Côte d'Azur</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #FBFCFD;
  --bg-soft: #F2F7FB;
  --surface: #FFFFFF;
  --surface-2: #F4F8FB;
  --ink: #0A2540;
  --ink-soft: #3B5872;
  --ink-muted: #7C92A8;
  --line: rgba(10,37,64,0.08);
  --line-strong: rgba(10,37,64,0.16);
  --navy: #0A2540;
  --accent: #3A8DDE;
  --accent-soft: rgba(58,141,222,0.12);
  --btn-fg: #FFFFFF;
  --radius: 999px;
  --r-card: 22px;
  --r-input: 18px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
body { font-size: 15px; line-height: 1.55; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 14px; color: inherit; }
img { max-width: 100%; display: block; }
h1, h2, h3, h4, h5 { font-family: 'Fraunces', 'Times New Roman', serif; font-weight: 400; letter-spacing: -0.01em; color: var(--ink); margin: 0; }
h1 { font-size: clamp(40px, 5vw, 64px); line-height: 1.05; letter-spacing: -0.025em; }
h2 { font-size: clamp(28px, 3vw, 40px); line-height: 1.1; letter-spacing: -0.02em; }
h3 { font-size: 20px; line-height: 1.3; }
h4 { font-size: 14px; font-family: 'Inter', sans-serif; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink-soft); }
p { margin: 0; color: var(--ink-soft); }
.muted { color: var(--ink-muted); font-weight: 400; }
.eyebrow { font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
.lead { font-size: 17px; color: var(--ink-soft); line-height: 1.6; }

/* ===== BUTTONS ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 22px; font-size: 14px; font-weight: 500; border: none; border-radius: var(--radius); transition: all .2s ease; white-space: nowrap; }
.btn-primary { background: var(--navy); color: var(--btn-fg); }
.btn-primary:hover { background: var(--accent); transform: translateY(-1px); box-shadow: 0 8px 24px -8px var(--accent); }
.btn-outline { background: transparent; color: var(--ink); border: 1px solid var(--line-strong); }
.btn-outline:hover { background: var(--surface-2); border-color: var(--ink); }
.btn-ghost { background: transparent; color: var(--ink); padding: 10px 16px; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-block { width: 100%; }
.icon-btn { position: relative; width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--radius); transition: all .2s; }
.icon-btn:hover { border-color: var(--ink); }
.icon-btn .badge { position: absolute; top: -4px; right: -4px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 999px; }
.icon-btn-lg { width: 48px; height: 48px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--radius); display: inline-flex; align-items: center; justify-content: center; transition: all .2s; }
.icon-btn-lg.active { color: var(--accent); border-color: var(--accent); }
.link { background: none; border: none; color: var(--accent); font-size: 13px; padding: 0; }
.link:hover { text-decoration: underline; }

/* ===== NAV ===== */
.nav { position: sticky; top: 0; background: rgba(251,252,253,0.85); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); z-index: 100; }
.nav-inner { max-width: 1280px; margin: 0 auto; padding: 18px 32px; display: flex; align-items: center; gap: 32px; }
.logo { display: flex; align-items: center; gap: 10px; background: none; border: none; padding: 0; color: var(--ink); }
.logo-mark { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; background: var(--navy); color: white; border-radius: 12px; }
.logo-text { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
.logo-text sup { font-size: 14px; color: var(--accent); margin-left: 2px; }
.nav-links { display: flex; gap: 4px; flex: 1; justify-content: center; }
.nav-link { background: none; border: none; padding: 10px 16px; font-size: 14px; color: var(--ink-soft); border-radius: var(--radius); transition: all .15s; }
.nav-link:hover { color: var(--ink); background: var(--surface-2); }
.nav-link.active { color: var(--ink); font-weight: 500; }
.nav-actions { display: flex; gap: 10px; align-items: center; }
.hamburger-btn { display: none; width: 42px; height: 42px; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--radius); transition: all .2s; flex-shrink: 0; }
.hamburger-btn:hover { border-color: var(--ink); background: var(--surface-2); }
.mobile-menu { display: none; border-top: 1px solid var(--line); background: var(--surface); padding: 8px 16px 14px; }
.mobile-menu-link { display: block; width: 100%; text-align: left; background: none; border: none; padding: 14px 12px; font-size: 16px; font-weight: 500; color: var(--ink-soft); border-radius: 12px; transition: all .15s; }
.mobile-menu-link:hover { background: var(--surface-2); color: var(--ink); }
.mobile-menu-link.active { color: var(--ink); background: var(--accent-soft); }

/* ===== HERO ===== */
.hero { position: relative; padding: 80px 32px 60px; min-height: 600px; display: flex; flex-direction: column; }
.hero-bg { position: absolute; inset: 0; overflow: hidden; clip-path: inset(0); }
.hero-bg img { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; will-change: transform; z-index: 0; }
.hero-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
.hero-overlay-grad { background: linear-gradient(180deg, rgba(10,37,64,0.55) 0%, rgba(10,37,64,0.25) 50%, rgba(10,37,64,0.7) 100%); }
.hero-content { position: relative; max-width: 1280px; margin: 0 auto; width: 100%; padding-top: 40px; flex: 1; }
.hero-eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background: rgba(255,255,255,0.14); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.18); border-radius: 999px; color: white; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 24px; }
.hero-eyebrow .dot { width: 6px; height: 6px; background: #5BAEDC; border-radius: 50%; box-shadow: 0 0 0 4px rgba(91,174,220,0.3); }
.hero-title { color: white; max-width: 720px; margin: 0 0 24px; font-size: clamp(48px, 6vw, 80px); }
.hero-sub { color: rgba(255,255,255,0.85); max-width: 580px; font-size: 18px; line-height: 1.55; margin-bottom: 40px; }
.hero-search { position: relative; max-width: 1080px; }
.hero-stats { position: relative; max-width: 1280px; margin: 60px auto 0; width: 100%; display: flex; gap: 56px; }
.hero-stats > div { color: white; }
.hero-stats strong { display: flex; align-items: center; gap: 6px; font-family: 'Fraunces', serif; font-size: 36px; font-weight: 400; }
.hero-stats span { display: block; font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 4px; }

/* ===== SEARCH BAR ===== */
.searchbar { background: var(--surface); border-radius: var(--radius); padding: 8px; display: flex; align-items: center; gap: 0; box-shadow: 0 24px 48px -16px rgba(10,37,64,0.18), 0 4px 12px -4px rgba(10,37,64,0.08); border: 1px solid var(--line); }
.searchbar.compact { box-shadow: 0 4px 12px -4px rgba(10,37,64,0.06); }
.search-field { flex: 1; display: flex; align-items: center; gap: 12px; padding: 10px 18px; color: var(--ink-soft); border-radius: var(--radius); transition: background .15s; }
.search-field:hover { background: var(--surface-2); }
.search-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.search-col label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 2px; }
.search-col input, .search-col select { background: transparent; border: none; outline: none; padding: 0; color: var(--ink); font-weight: 500; font-size: 14px; width: 100%; appearance: none; }
.search-divider { width: 1px; height: 36px; background: var(--line); flex-shrink: 0; }
.search-btn { padding: 14px 22px; }

/* ===== SECTIONS ===== */
.section { max-width: 1280px; margin: 0 auto; padding: 80px 32px; }
.section-head { display: flex; align-items: end; justify-content: space-between; margin-bottom: 36px; gap: 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }

/* ===== BOAT CARD ===== */
.boat-card { background: var(--surface); border-radius: var(--r-card); overflow: hidden; cursor: pointer; transition: transform .25s ease, box-shadow .25s ease; border: 1px solid var(--line); }
.boat-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -16px rgba(10,37,64,0.18); }
.boat-img { position: relative; aspect-ratio: 4/3; overflow: hidden; background: var(--surface-2); }
.boat-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
.boat-card:hover .boat-img img { transform: scale(1.04); }
.boat-tag { position: absolute; top: 14px; left: 14px; padding: 6px 12px; background: rgba(255,255,255,0.95); border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink); backdrop-filter: blur(8px); }
.boat-body { padding: 22px; }
.boat-row { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 8px; }
.boat-row h3 { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; }
.rating { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink); font-weight: 500; }
.rating svg { color: var(--accent); }
.boat-meta { font-size: 13px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0 0 18px; }
.boat-meta span { display: inline-flex; align-items: center; gap: 4px; }
.dot-sep { color: var(--line-strong); }
.boat-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 16px; border-top: 1px solid var(--line); }
.price strong { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; color: var(--ink); }
.price span { font-size: 13px; color: var(--ink-soft); }
.boat-cta { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--accent); font-weight: 500; }

/* ===== VALUE GRID ===== */
.value-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.value-card { padding: 36px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.value-icon { display: inline-flex; width: 48px; height: 48px; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); border-radius: 14px; margin-bottom: 20px; }
.value-card h3 { font-family: 'Fraunces', serif; font-size: 22px; margin-bottom: 8px; }

/* ===== DESTINATIONS ===== */
.dest-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.dest-card { position: relative; aspect-ratio: 3/4; border-radius: var(--r-card); overflow: hidden; border: none; padding: 0; background: var(--surface-2); cursor: pointer; }
.dest-card img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
.dest-card:hover img { transform: scale(1.06); }
.dest-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(10,37,64,0.85) 100%); }
.dest-info { position: absolute; left: 20px; bottom: 20px; right: 20px; color: white; text-align: left; }
.dest-info h4 { font-family: 'Fraunces', serif; font-size: 24px; color: white; text-transform: none; letter-spacing: 0; font-weight: 500; }
.dest-info span { font-size: 13px; color: rgba(255,255,255,0.75); }

/* ===== CATALOG ===== */
.catalog-bar { max-width: 1280px; margin: 0 auto; padding: 24px 32px 0; }
.catalog-body { max-width: 1280px; margin: 0 auto; padding: 32px; display: grid; grid-template-columns: 280px 1fr; gap: 40px; }
.catalog-body.single { grid-template-columns: 1fr; }
.filters { position: sticky; top: 96px; align-self: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 24px; }
.filters-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.filters-head h3 { font-family: 'Fraunces', serif; font-size: 20px; }
.filter-block { padding: 18px 0; border-top: 1px solid var(--line); }
.filter-block:first-of-type { border-top: none; padding-top: 0; }
.filter-block h4 { margin: 0 0 12px; font-size: 11px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 12px; color: var(--ink-soft); transition: all .15s; }
.chip:hover { border-color: var(--ink-soft); }
.chip.active { background: var(--navy); color: white; border-color: var(--navy); }
.range-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.stepper { display: flex; align-items: center; justify-content: space-between; padding: 8px; border: 1px solid var(--line); border-radius: 999px; }
.stepper button { width: 32px; height: 32px; border-radius: 999px; border: none; background: var(--surface-2); color: var(--ink); display: flex; align-items: center; justify-content: center; }
.stepper button:hover { background: var(--accent-soft); color: var(--accent); }
.stepper span { font-size: 14px; font-weight: 500; }
.radio-list { display: flex; flex-direction: column; gap: 4px; }
.radio { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 999px; cursor: pointer; transition: background .15s; font-size: 14px; }
.radio:hover { background: var(--surface-2); }
.radio.active { background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.radio input { accent-color: var(--accent); }

.catalog-results .catalog-head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 24px; gap: 16px; }
.catalog-results .catalog-head h2 { font-size: 28px; }
.mobile-filters { display: none; }
.empty { grid-column: 1 / -1; padding: 60px; text-align: center; background: var(--surface); border-radius: var(--r-card); border: 1px solid var(--line); }
.empty.big { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 80px; color: var(--ink-soft); }
.empty.big svg { color: var(--accent); }

/* ===== DETAIL ===== */
.detail-top { max-width: 1280px; margin: 0 auto; padding: 20px 32px 0; }
.back { display: inline-flex; align-items: center; gap: 8px; background: none; border: none; color: var(--ink-soft); font-size: 13px; padding: 8px 0; }
.back:hover { color: var(--ink); }
.gallery { max-width: 1280px; margin: 16px auto 0; padding: 0 32px; }
.gallery-main { position: relative; aspect-ratio: 16/8; border-radius: var(--r-card); overflow: hidden; background: var(--surface-2); margin-bottom: 12px; }
.gallery-main img { width: 100%; height: 100%; object-fit: cover; }
.gal-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.95); border: none; color: var(--ink); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); transition: all .15s; }
.gal-arrow.left { left: 20px; }
.gal-arrow.right { right: 20px; }
.gal-arrow:hover { background: white; transform: translateY(-50%) scale(1.05); }
.gal-counter { position: absolute; bottom: 20px; right: 20px; padding: 6px 14px; background: rgba(10,37,64,0.7); color: white; font-size: 12px; border-radius: 999px; backdrop-filter: blur(8px); }
.gallery-thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.thumb { aspect-ratio: 4/3; border-radius: 14px; overflow: hidden; border: 2px solid transparent; padding: 0; background: var(--surface-2); cursor: pointer; transition: all .15s; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb.active { border-color: var(--accent); }

.detail-body { max-width: 1280px; margin: 0 auto; padding: 60px 32px; display: grid; grid-template-columns: 1fr 380px; gap: 60px; align-items: start; }
.detail-head { display: flex; justify-content: space-between; align-items: start; gap: 16px; padding-bottom: 32px; border-bottom: 1px solid var(--line); margin-bottom: 32px; }
.detail-head h1 { font-size: 48px; margin-top: 8px; }
.detail-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: 14px; color: var(--ink-soft); }
.detail-section { padding: 24px 0; border-bottom: 1px solid var(--line); }
.detail-section:last-child { border-bottom: none; }
.detail-section h3 { font-family: 'Fraunces', serif; font-size: 22px; margin-bottom: 14px; }
.features { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.features li { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-soft); }
.features svg { color: var(--accent); }
.includes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.includes div { display: flex; align-items: center; gap: 10px; padding: 14px; background: var(--surface-2); border-radius: 14px; font-size: 14px; }
.includes svg { color: var(--accent); }

.booking-card { position: sticky; top: 96px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 28px; box-shadow: 0 12px 32px -12px rgba(10,37,64,0.1); }
.bk-price { display: flex; align-items: baseline; gap: 4px; }
.bk-price strong { font-family: 'Fraunces', serif; font-size: 36px; font-weight: 400; }
.bk-price span { color: var(--ink-soft); font-size: 14px; }
.bk-rating { font-size: 13px; color: var(--ink-soft); margin: 6px 0 24px; display: inline-flex; align-items: center; gap: 4px; }
.bk-rating svg { color: var(--accent); }
.booking-card .btn { margin-bottom: 10px; }
.bk-list { list-style: none; padding: 16px 0 0; margin: 16px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.bk-list li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
.bk-list svg { color: var(--accent); }

/* ===== BOOKING ===== */
.booking-grid { max-width: 1280px; margin: 16px auto 0; padding: 0 32px 60px; display: grid; grid-template-columns: 1fr 380px; gap: 40px; align-items: start; }
.stepper-bar { display: flex; gap: 0; margin-bottom: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px; }
.step { flex: 1; display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; transition: background .15s; }
.step.active { background: var(--accent-soft); }
.step-num { width: 26px; height: 26px; border-radius: 999px; background: var(--surface-2); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.step.active .step-num { background: var(--accent); color: white; }
.step.done .step-num { background: var(--navy); color: white; }
.step-label { font-size: 13px; color: var(--ink-soft); }
.step.active .step-label { color: var(--ink); font-weight: 500; }

.step-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 36px; }
.step-card h2 { font-size: 28px; margin-bottom: 20px; }
.step-card .sub { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin: 28px 0 12px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg-btn { padding: 18px 22px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; transition: all .15s; }
.seg-btn:hover { border-color: var(--ink-soft); }
.seg-btn.active { border-color: var(--accent); background: var(--accent-soft); }
.seg-btn strong { font-size: 14px; color: var(--ink); }
.seg-btn span { font-size: 12px; color: var(--ink-soft); }

.extras { display: flex; flex-direction: column; gap: 8px; }
.extra { display: flex; align-items: center; gap: 14px; padding: 14px 22px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; transition: all .15s; }
.extra:hover { border-color: var(--ink-soft); }
.extra.active { border-color: var(--accent); background: var(--accent-soft); }
.extra input { display: none; }
.extra-check { width: 22px; height: 22px; border-radius: 999px; border: 1.5px solid var(--line-strong); display: flex; align-items: center; justify-content: center; color: transparent; flex-shrink: 0; }
.extra.active .extra-check { background: var(--accent); border-color: var(--accent); color: white; }
.extra-label { flex: 1; font-size: 14px; }
.extra-price { font-size: 14px; font-weight: 500; color: var(--ink); }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.full { grid-column: 1 / -1; }
.field span { font-size: 12px; font-weight: 500; letter-spacing: 0.04em; color: var(--ink-soft); }
.field input, .field select, .field textarea { padding: 14px 20px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); outline: none; transition: border .15s; }
.field textarea { border-radius: 22px; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; font-family: inherit; }

.step-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
.step-actions .btn:only-child { margin-left: auto; }

/* SUCCESS */
.success { text-align: center; }
.success-icon { width: 64px; height: 64px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
.success h2 { margin-bottom: 12px; }
.recap { margin: 28px 0; padding: 20px; background: var(--surface-2); border-radius: 18px; }
.recap-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; }
.recap-row span { color: var(--ink-soft); }
.recap-row.total { padding-top: 14px; margin-top: 6px; border-top: 1px solid var(--line); }
.recap-row.total strong { font-family: 'Fraunces', serif; font-size: 22px; }

/* SUMMARY */
.booking-summary { position: sticky; top: 96px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 24px; }
.bs-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 16px; margin-bottom: 16px; }
.booking-summary h3 { font-family: 'Fraunces', serif; font-size: 22px; margin-bottom: 4px; }
.booking-summary > .muted { font-size: 13px; margin-bottom: 18px; }
.bs-line { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; }
.bs-line span { color: var(--ink-soft); }
.bs-divider { height: 1px; background: var(--line); margin: 12px 0; }
.bs-total { display: flex; justify-content: space-between; align-items: baseline; }
.bs-total span { font-size: 14px; color: var(--ink-soft); }
.bs-total strong { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 500; }
.bs-note { font-size: 12px; color: var(--ink-muted); margin-top: 14px; }

/* ===== CALENDAR ===== */
.cal { background: var(--surface-2); border-radius: 18px; padding: 20px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cal-head h4 { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; text-transform: capitalize; letter-spacing: 0; color: var(--ink); }
.cal-head button { width: 32px; height: 32px; border-radius: 999px; border: none; background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center; }
.cal-head button:hover { background: var(--accent-soft); color: var(--accent); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 11px; font-weight: 600; color: var(--ink-muted); padding: 8px 0; text-transform: uppercase; }
.cal-cell { aspect-ratio: 1; border: none; background: transparent; border-radius: 12px; font-size: 13px; color: var(--ink); transition: all .15s; }
.cal-cell:hover:not(.disabled):not(.empty) { background: var(--surface); }
.cal-cell.selected { background: var(--accent); color: white; font-weight: 600; }
.cal-cell.disabled { color: var(--ink-muted); text-decoration: line-through; cursor: not-allowed; opacity: 0.5; }
.cal-cell.empty { pointer-events: none; }
.cal-legend { display: flex; gap: 20px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-soft); flex-wrap: wrap; }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.lg-dot { width: 10px; height: 10px; border-radius: 999px; }
.lg-dot.avail { background: var(--surface); border: 1.5px solid var(--ink-soft); }
.lg-dot.unav { background: var(--surface-2); border: 1.5px solid var(--line-strong); position: relative; }
.lg-dot.unav::after { content: ''; position: absolute; left: 1px; right: 1px; top: 50%; height: 1.5px; background: var(--ink-muted); }
.lg-dot.sel { background: var(--accent); }

/* ===== ABOUT ===== */
.about-hero { max-width: 1280px; margin: 0 auto; padding: 80px 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
.about-hero h1 { margin: 12px 0 24px; }
.about-hero .lead { margin-bottom: 28px; }
.about-img { aspect-ratio: 4/5; border-radius: var(--r-card); overflow: hidden; }
.about-img img { width: 100%; height: 100%; object-fit: cover; }
.manifesto { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
.manifesto > div { padding: 0; }
.big-num { font-family: 'Fraunces', serif; font-size: 14px; color: var(--accent); display: block; margin-bottom: 16px; letter-spacing: 0.1em; }
.manifesto h3 { font-family: 'Fraunces', serif; font-size: 26px; margin-bottom: 12px; }
.quote { text-align: center; padding: 100px 32px; background: var(--bg-soft); max-width: none; margin: 0; }
.quote blockquote { max-width: 800px; margin: 0 auto; }
.quote p { font-family: 'Fraunces', serif; font-style: italic; font-size: clamp(28px, 3.5vw, 44px); line-height: 1.25; color: var(--ink); margin-bottom: 24px; }
.quote span { font-size: 14px; color: var(--ink-soft); }

/* ===== CONTACT ===== */
.contact-grid { max-width: 1280px; margin: 0 auto; padding: 80px 32px; display: grid; grid-template-columns: 1fr 1.1fr; gap: 80px; align-items: start; }
.contact-info h1 { margin: 12px 0 20px; }
.contact-list { list-style: none; padding: 0; margin: 36px 0 0; display: flex; flex-direction: column; gap: 16px; }
.contact-list li { display: flex; align-items: center; gap: 16px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.contact-list svg { color: var(--accent); flex-shrink: 0; }
.contact-list strong { display: block; font-size: 15px; color: var(--ink); font-weight: 500; }
.contact-list span { font-size: 13px; color: var(--ink-soft); }
.contact-form { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 36px; }
.sent { text-align: center; padding: 40px 20px; }

/* ===== FOOTER ===== */
.foot { background: var(--navy); color: rgba(255,255,255,0.85); padding: 60px 32px 24px; margin-top: 60px; }
.foot-inner { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 1.2fr 2fr; gap: 60px; padding-bottom: 40px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.foot-brand .logo { color: white; margin-bottom: 16px; }
.foot-brand .logo-mark { background: rgba(255,255,255,0.12); }
.foot-brand p { color: rgba(255,255,255,0.6); font-size: 14px; }
.foot-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.foot-cols h5 { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: white; margin-bottom: 14px; }
.foot-cols a { display: block; padding: 6px 0; color: rgba(255,255,255,0.65); text-decoration: none; font-size: 14px; cursor: pointer; }
.foot-cols a:hover { color: white; }
.foot-bottom { max-width: 1280px; margin: 0 auto; padding-top: 24px; display: flex; justify-content: space-between; font-size: 13px; color: rgba(255,255,255,0.5); }

/* ===== PLANNING ===== */
.planning { max-width: 1280px; margin: 0 auto; padding: 40px 32px 60px; }
.planning-head { display: flex; justify-content: space-between; align-items: end; gap: 32px; margin-bottom: 32px; flex-wrap: wrap; }
.planning-head h1 { margin: 8px 0 12px; font-size: clamp(36px, 4vw, 52px); }
.planning-head .lead { max-width: 520px; }
.planning-stats { display: flex; gap: 12px; }
.pstat { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px 22px; min-width: 130px; }
.pstat-num { display: block; font-family: 'Fraunces', serif; font-size: 30px; font-weight: 500; color: var(--navy); line-height: 1; }
.pstat-lbl { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 6px; }

.planning-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 24px; margin-bottom: 20px; flex-wrap: wrap; }
.month-nav { display: flex; align-items: center; gap: 12px; }
.month-title { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 500; text-transform: capitalize; letter-spacing: 0; min-width: 200px; }
.today-btn { font-size: 13px; }
.planning-legend { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-dot { display: inline-block; width: 8px; height: 8px; border-radius: 999px; margin-right: 8px; vertical-align: middle; }

.planning-grid-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 4px; overflow-x: auto; position: relative; }
.planning-grid { display: grid; grid-template-columns: 220px 1fr; min-width: 1100px; }
.pg-corner { padding: 14px 18px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); border-bottom: 1px solid var(--line); display: flex; align-items: end; }
.pg-days { display: grid; grid-template-columns: repeat(var(--days), 1fr); border-bottom: 1px solid var(--line); }
.pg-day { padding: 10px 4px; text-align: center; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.pg-day:first-child { border-left: none; }
.pg-day.weekend { background: var(--surface-2); }
.pg-day-num { font-size: 13px; font-weight: 600; color: var(--ink); }
.pg-day-dow { font-size: 10px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; }

.pg-boat { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border: none; background: transparent; text-align: left; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); cursor: pointer; transition: background .15s; }
.pg-boat:hover { background: var(--surface-2); }
.pg-boat img { width: 42px; height: 42px; object-fit: cover; border-radius: 12px; flex-shrink: 0; }
.pg-boat-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pg-boat-info strong { font-size: 14px; color: var(--ink); font-weight: 500; }
.pg-boat-info span { font-size: 11px; color: var(--ink-soft); }

.pg-row { position: relative; display: grid; grid-template-columns: repeat(var(--days), 1fr); border-bottom: 1px solid var(--line); min-height: 70px; }
.pg-cell { border-left: 1px solid var(--line); cursor: pointer; transition: background .12s; }
.pg-cell:first-child { border-left: none; }
.pg-cell:hover { background: var(--accent-soft); }
.pg-cell.weekend { background: rgba(58,141,222,0.04); }
.pg-cell.weekend:hover { background: var(--accent-soft); }

.pg-block { position: absolute; top: 12px; bottom: 12px; border-radius: 999px; padding: 0 14px; display: flex; align-items: center; color: white; cursor: pointer; transition: transform .15s, box-shadow .15s; overflow: hidden; }
.pg-block:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -8px rgba(10,37,64,0.3); z-index: 2; }
.pg-block-label { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pg-tooltip { position: sticky; bottom: 16px; left: 16px; margin: 16px; background: var(--navy); color: white; padding: 10px 16px; border-radius: 999px; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 12px 28px -8px rgba(10,37,64,0.4); width: fit-content; }
.pg-tooltip .muted { color: rgba(255,255,255,0.65); }
.pg-tip-dot { width: 8px; height: 8px; border-radius: 999px; }

.planning-cta { display: flex; justify-content: space-between; align-items: center; gap: 24px; margin-top: 32px; padding: 32px; background: var(--bg-soft); border-radius: 22px; flex-wrap: wrap; }
.planning-cta h3 { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 500; margin-bottom: 6px; }
.planning-cta p { color: var(--ink-soft); }

/* ===== VIEW SWITCH ===== */
.view-switch { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 4px; margin-right: 6px; }
.vs-btn { padding: 8px 16px; font-size: 13px; font-weight: 500; border: none; background: transparent; color: var(--ink-soft); border-radius: 999px; transition: all .15s; cursor: pointer; }
.vs-btn.active { background: var(--surface); color: var(--ink); box-shadow: 0 2px 6px -2px rgba(10,37,64,0.15); }

/* ===== WEEK VIEW ===== */
.planning-grid-wrap.week { padding: 0; }
.week-grid { display: grid; grid-template-columns: 220px 1fr; min-width: 1100px; }
.wk-corner { padding: 14px 18px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); border-bottom: 1px solid var(--line); display: flex; align-items: end; }
.wk-days { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--line); }
.wk-day { padding: 10px 8px 6px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.wk-day:first-child { border-left: none; }
.wk-day.today { background: var(--accent-soft); }
.wk-day-dow { font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; }
.wk-day.today .wk-day-dow { color: var(--accent); font-weight: 600; }
.wk-day-num { font-family: 'Fraunces', serif; font-size: 18px; color: var(--ink); margin-bottom: 4px; }
.wk-hours { display: grid; grid-template-columns: repeat(var(--hours), 1fr); margin-top: 4px; }
.wk-hour { font-size: 9px; color: var(--ink-muted); text-align: left; padding-left: 1px; }
.wk-hour.noon { color: var(--ink-soft); font-weight: 600; }

.wk-row { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--line); min-height: 70px; }
.wk-day-col { position: relative; border-left: 1px solid var(--line); cursor: pointer; transition: background .12s; min-height: 70px; }
.wk-day-col:first-child { border-left: none; }
.wk-day-col:hover { background: var(--accent-soft); }
.wk-hour-lines { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--hours), 1fr); pointer-events: none; }
.wk-hour-lines span { border-left: 1px dashed var(--line); }
.wk-hour-lines span:first-child { border-left: none; }
.wk-hour-lines span.noon { border-left: 1px solid var(--line-strong); }

.wk-block { position: absolute; top: 10px; bottom: 10px; border-radius: 999px; padding: 6px 14px; display: flex; flex-direction: column; justify-content: center; color: white; cursor: pointer; transition: transform .15s, box-shadow .15s; overflow: hidden; line-height: 1.2; }
.wk-block:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -8px rgba(10,37,64,0.3); z-index: 2; }
.wk-block-slot { font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.85; }
.wk-block-client { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@media (max-width: 768px) {
  .planning-head { flex-direction: column; align-items: stretch; }
  .planning-stats { overflow-x: auto; }
  .pstat { min-width: 110px; }
}

[data-theme="dark"] .nav { background: rgba(6,18,31,0.85); }
[data-theme="dark"] .gal-arrow, [data-theme="dark"] .boat-tag { background: rgba(15,34,55,0.95); color: var(--ink); }

/* ===== RESPONSIVE ===== */
@media (max-width: 1024px) {
  .grid-3, .value-grid, .manifesto, .foot-cols { grid-template-columns: repeat(2, 1fr); }
  .dest-grid { grid-template-columns: repeat(2, 1fr); }
  .catalog-body { grid-template-columns: 1fr; }
  .filters { position: static; }
  .detail-body, .booking-grid, .about-hero, .contact-grid, .foot-inner { grid-template-columns: 1fr; gap: 32px; }
  .booking-card, .booking-summary { position: static; }
  .searchbar { flex-direction: column; align-items: stretch; }
  .search-divider { display: none; }
  .hero-stats { gap: 24px; flex-wrap: wrap; }
}
@media (max-width: 860px) {
  .nav-inner { padding: 12px 16px; gap: 10px; }
  .logo-text { font-size: 18px; }
  .logo-mark { width: 32px; height: 32px; border-radius: 10px; }
  .nav-links { display: none; }
  .nav-actions { gap: 8px; margin-left: auto; }
  .nav-actions .nav-cta { padding: 10px 16px; font-size: 13px; }
  .hamburger-btn { display: inline-flex; }
  .mobile-menu { display: block; }
}
@media (max-width: 640px) {
  body { font-size: 14px; }
  .grid-3, .value-grid, .manifesto, .foot-cols, .dest-grid { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .seg { grid-template-columns: 1fr 1fr; }
  .features, .includes { grid-template-columns: 1fr; }
  .section { padding: 48px 18px; }
  .section-head { flex-direction: column; align-items: flex-start; gap: 12px; margin-bottom: 24px; }
  .hero { padding: 48px 18px 32px; min-height: 520px; }
  .hero-title { font-size: clamp(36px, 9vw, 48px); margin-bottom: 16px; }
  .hero-sub { font-size: 15px; margin-bottom: 28px; }
  .hero-eyebrow { font-size: 11px; padding: 6px 12px; margin-bottom: 18px; }
  .hero-stats { gap: 20px; margin-top: 36px; }
  .hero-stats strong { font-size: 26px; }
  .hero-stats span { font-size: 12px; }
  .searchbar { padding: 6px; gap: 4px; }
  .search-field { padding: 10px 14px; }
  .search-btn { padding: 14px; width: 100%; }
  h1 { font-size: clamp(32px, 8vw, 44px); }
  h2 { font-size: clamp(24px, 6vw, 32px); }
  .lead { font-size: 15px; }
  .catalog-bar { padding: 16px 18px 0; }
  .catalog-body { padding: 20px 18px; gap: 24px; }
  .catalog-results .catalog-head { flex-direction: column; align-items: flex-start; gap: 8px; }
  .filters { padding: 18px; }
  .boat-body { padding: 18px; }
  .boat-row h3 { font-size: 19px; }
  .detail-top { padding: 14px 18px 0; }
  .gallery { margin-top: 12px; padding: 0 18px; }
  .gallery-main { aspect-ratio: 4/3; border-radius: 18px; }
  .gallery-thumbs { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .thumb { border-radius: 10px; }
  .gal-arrow { width: 38px; height: 38px; }
  .gal-arrow.left { left: 10px; }
  .gal-arrow.right { right: 10px; }
  .detail-body { padding: 32px 18px; gap: 24px; }
  .detail-head { flex-direction: column; gap: 12px; padding-bottom: 22px; margin-bottom: 22px; }
  .detail-head h1 { font-size: 32px; }
  .booking-card { padding: 22px; }
  .booking-grid { padding: 0 18px 40px; gap: 24px; }
  .step-card { padding: 22px; }
  .step-card h2 { font-size: 22px; }
  .stepper-bar { flex-direction: column; padding: 6px; border-radius: 22px; }
  .step { width: 100%; padding: 8px 12px; }
  .step-actions { flex-direction: column-reverse; }
  .step-actions .btn { width: 100%; }
  .seg-btn { padding: 14px 16px; }
  .about-hero { padding: 48px 18px; gap: 28px; }
  .quote { padding: 60px 22px; }
  .contact-grid { padding: 48px 18px; gap: 32px; }
  .contact-form { padding: 22px; }
  .planning { padding: 24px 16px 40px; }
  .planning-toolbar { gap: 12px; }
  .month-title { font-size: 18px; min-width: 0; }
  .planning-cta { padding: 22px; gap: 14px; }
  .planning-cta .btn { width: 100%; }
  .pstat { min-width: 100px; padding: 14px 16px; }
  .pstat-num { font-size: 24px; }
  .foot { padding: 48px 18px 22px; }
  .foot-inner { gap: 32px; padding-bottom: 28px; }
  .foot-cols { grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .foot-bottom { flex-direction: column; gap: 6px; text-align: center; }
  .btn { padding: 12px 20px; }
}
@media (max-width: 420px) {
  .foot-cols { grid-template-columns: 1fr; }
  .seg { grid-template-columns: 1fr; }
  .gallery-thumbs { grid-template-columns: repeat(3, 1fr); }
}

</style>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}

    if (filters.sort === "price-asc") list.sort((a, b) => a.price - b.price);
    if (filters.sort === "price-desc") list.sort((a, b) => b.price - a.price);
    if (filters.sort === "rating") list.sort((a, b) => b.rating - a.rating);
    return list;
  }, [query, filters]);

  const types = ["all", ...Array.from(new Set(BOATS.map((b) => b.type)))];

  return (

        <SearchBar query={query} setQuery={setQuery} compact onSubmit={() => {}} />

          <div className="filter-block">

              <span>{filters.minCap} personnes</span>

// ============ CALENDAR ============
function Calendar({ selected, onSelect }) {
  const [view, setView] = useState(() => {
    const d = new Date();
    return { y: d.getFullYear(), m: d.getMonth() };
  });
  const today = new Date();today.setHours(0, 0, 0, 0);
  const first = new Date(view.y, view.m, 1);
  const last = new Date(view.y, view.m + 1, 0);
  const startOff = (first.getDay() + 6) % 7;
  const days = [];
  for (let i = 0; i < startOff; i++) days.push(null);
  for (let i = 1; i <= last.getDate(); i++) days.push(new Date(view.y, view.m, i));

  const monthName = first.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });

  // randomly mark some as unavailable for realism
  const unavailable = useMemo(() => {
    const set = new Set();
    [3, 4, 12, 18, 19].forEach((d) => set.add(`${view.y}-${view.m}-${d}`));
    return set;
  }, [view]);

  return (
    <div className="cal">
      <div className="cal-head">
        <button onClick={() => setView({ y: view.m === 0 ? view.y - 1 : view.y, m: (view.m + 11) % 12 })}><Icon name="arrowL" size={16} /></button>
        <h4>{monthName}</h4>
        <button onClick={() => setView({ y: view.m === 11 ? view.y + 1 : view.y, m: (view.m + 1) % 12 })}><Icon name="arrow" size={16} /></button>
      </div>
      <div className="cal-grid">
        {["L", "M", "M", "J", "V", "S", "D"].map((d, i) => <span key={i} className="cal-dow">{d}</span>)}
        {days.map((d, i) => {
          if (!d) return <span key={i} className="cal-cell empty" />;
          const iso = d.toISOString().slice(0, 10);
          const isPast = d < today;
          const isUnav = unavailable.has(`${view.y}-${view.m}-${d.getDate()}`);
          const isSel = selected === iso;
          const cls = "cal-cell" + (isSel ? " selected" : "") + (isPast || isUnav ? " disabled" : "");
          return (
            <button key={i} className={cls} disabled={isPast || isUnav} onClick={() => onSelect(iso)}>
              {d.getDate()}
            </button>);

        })}
      </div>
      <div className="cal-legend">
        <span className="lg"><i className="lg-dot avail" /> Disponible</span>
        <span className="lg"><i className="lg-dot unav" /> Réservé</span>
        <span className="lg"><i className="lg-dot sel" /> Votre choix</span>
      </div>
    </div>);

}
