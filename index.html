<!-- Base dynamique : adapte les chemins selon l'hébergement.
     - GitHub Pages : sous-dossier /South-Boat/
     - south-boat.com / Hostinger : racine /
     DOIT rester en tête du <head>, avant tout <link>/<script> qui charge un fichier. -->
<script>
(function () {
  var base = location.pathname.startsWith("/South-Boat") ? "/South-Boat/" : "/";
  document.write('<base href="' + base + '">');
})();
</script>

<!-- Perf : précharge l'image hero (élément LCP) uniquement sur la page d'accueil -->
<script>
(function () {
  var p = location.pathname;
  if (p === "/" || p === "/South-Boat/" || p === "/South-Boat") {
    var base = p.indexOf("/South-Boat") === 0 ? "/South-Boat/" : "/";
    var l = document.createElement("link");
    // Même srcset ET même point de bascule que la balise <picture> du hero,
    // sinon le téléphone précharge une image que le rendu n'utilisera pas :
    // deux fois le trafic, et le LCP n'y gagne rien.
    var portrait = window.matchMedia && window.matchMedia("(max-width: 700px)").matches;
    var nom = "images/drone/bateau-eau-turquoise-esterel-vue-drone";
    l.rel = "preload"; l.as = "image";
    if (portrait) {
      l.href = base + nom + "-portrait.jpg";
      l.setAttribute("imagesrcset", base + nom + "-portrait-800.jpg 800w, " + base + nom + "-portrait.jpg 1200w");
    } else {
      l.href = base + nom + ".jpg";
      l.setAttribute("imagesrcset", base + nom + "-800.jpg 800w, " + base + nom + ".jpg 2400w");
    }
    l.setAttribute("imagesizes", "100vw");
    l.setAttribute("fetchpriority", "high");
    document.head.appendChild(l);
  }
})();
</script>
