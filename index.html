<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

// ============ I18N ============
window.LangContext = React.createContext({ lang: "fr", setLang: () => {} });
window.useT = () => {
  const ctx = React.useContext(window.LangContext);
  const t = (fr, en) => ctx.lang === "en" ? (en != null ? en : fr) : fr;
  t.lang = ctx.lang;
  t.setLang = ctx.setLang;
  return t;
};

function LangProvider({ children }) {
  const [lang, setLangState] = useState(() => {
    try { return localStorage.getItem("sb_lang") || "fr"; } catch (e) { return "fr"; }
  });
  const setLang = (l) => {
    setLangState(l);
    try { localStorage.setItem("sb_lang", l); } catch (e) {}
    document.documentElement.setAttribute("lang", l);
  };
  useEffect(() => { document.documentElement.setAttribute("lang", lang); }, [lang]);
  return <window.LangContext.Provider value={{ lang, setLang }}>{children}</window.LangContext.Provider>;
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const [page, setPage] = useState({ name: "home" });
  const [query, setQuery] = useState({
    port: "",
    from: new Date().toISOString().slice(0,10),
    to: new Date(Date.now() + 7*86400000).toISOString().slice(0,10),
    people: 4,
  });
  // apply theme + radius
  useEffect(() => {
    applyTheme(tweaks.darkMode);
    document.documentElement.setAttribute("data-theme", tweaks.darkMode ? "dark" : "light");
    document.documentElement.style.setProperty("--radius", tweaks.radius + "px");
  }, [tweaks.darkMode, tweaks.radius]);

  // scroll up on page change
  useEffect(() => { window.scrollTo({ top: 0, behavior: "instant" }); }, [page.name, page.id]);

  // SEO : titre + meta description dynamiques par page
  useEffect(() => {
    const SITE = "South Boat";
    const BOATS = window.BOATS || [];
    const ARTICLES = window.ARTICLES || [];
    let title = `${SITE} — Location de bateaux à Mandelieu, Côte d'Azur`;
    let desc  = "Location de bateaux à Mandelieu-La-Napoule sur la Côte d'Azur. Bateaux familiaux vérifiés, avec ou sans skipper, vers l'Esterel, Cannes et les îles de Lérins.";

    if (page.name === "catalog") {
      title = `Catalogue — Location de bateaux à Mandelieu | ${SITE}`;
      desc  = "Découvrez notre sélection de bateaux à louer au départ de Mandelieu-La-Napoule. Day cruisers, open premium, familiaux — avec ou sans skipper.";
    } else if (page.name === "planning") {
      title = `Disponibilités — Réserver un bateau à Mandelieu | ${SITE}`;
      desc  = "Consultez les disponibilités en temps réel de notre flotte de bateaux à louer à Mandelieu sur la Côte d'Azur.";
    } else if (page.name === "detail" && page.id) {
      const b = BOATS.find(x => x.id === page.id);
      if (b) {
        title = `${b.name} — ${b.type} à louer à ${b.port} | ${SITE}`;
        desc  = `${b.name} : ${b.type} de ${b.length}, jusqu'à ${b.capacity} personnes, à partir de ${b.price} € la journée. Location de bateau à ${b.port} sur la Côte d'Azur.`;
      }
    } else if (page.name === "booking") {
      title = `Réservation — Location de bateau à Mandelieu | ${SITE}`;
      desc  = "Finalisez votre réservation de bateau à Mandelieu. Paiement sécurisé, confirmation immédiate.";
    } else if (page.name === "about") {
      title = `À propos — Notre équipe et notre histoire | ${SITE}`;
      desc  = "South Boat, votre conciergerie de location de bateaux à Mandelieu-La-Napoule. Rencontrez l'équipe et notre vision de la mer en Côte d'Azur.";
    } else if (page.name === "contact") {
      title = `Contact — Conciergerie | ${SITE}`;
      desc  = "Contactez South Boat pour réserver votre journée en mer à Mandelieu. Conciergerie disponible du lundi au dimanche, 8h-19h.";
    } else if (page.name === "capsud") {
      title = `Cap Sud — Le blog du nautisme en Côte d'Azur | ${SITE}`;
      desc  = "Conseils, itinéraires, mouillages et destinations en bateau sur la Côte d'Azur. Le blog de South Boat pour préparer votre prochaine journée en mer.";
    } else if (page.name === "capsud-article" && page.id) {
      const a = ARTICLES.find(x => x.id === page.id || x.slug === page.id);
      if (a) {
        title = `${a.title} | Cap Sud — ${SITE}`;
        desc  = a.excerpt || a.description || desc;
      }
    }

    document.title = title;
    let m = document.querySelector('meta[name="description"]');
    if (!m) { m = document.createElement('meta'); m.setAttribute('name','description'); document.head.appendChild(m); }
    m.setAttribute('content', desc);

    // Mise à jour OG title/description pour le partage social en cours de navigation
    const ogT = document.querySelector('meta[property="og:title"]');
    const ogD = document.querySelector('meta[property="og:description"]');
    if (ogT) ogT.setAttribute('content', title);
    if (ogD) ogD.setAttribute('content', desc);
  }, [page.name, page.id]);

  return (
    <>
      <Nav page={page} setPage={setPage} />
      {page.name === "home" && <HomePage setPage={setPage} query={query} setQuery={setQuery} />}
      {page.name === "catalog" && <CatalogPage setPage={setPage} query={query} setQuery={setQuery} />}
      {page.name === "planning" && <PlanningPage setPage={setPage} />}
      {page.name === "detail" && <DetailPage id={page.id} setPage={setPage} />}
      {page.name === "booking" && <BookingPage id={page.id} setPage={setPage} initialDate={page.date} initialSlot={page.slot} />}
      {page.name === "about" && <AboutPage setPage={setPage} />}
      {page.name === "contact" && <ContactPage setPage={setPage} />}
      {page.name === "capsud" && <CapSudListPage setPage={setPage} />}
      {page.name === "capsud-article" && <CapSudArticlePage id={page.id} setPage={setPage} />}

      <TweaksPanel>
        <TweakSection title="Style des boutons">
          <TweakRadio
            label="Arrondi"
            value={tweaks.radius}
            onChange={(v) => setTweak("radius", v)}
            options={[
              { value: 6, label: "Net" },
              { value: 16, label: "Doux" },
              { value: 999, label: "Rond" },
            ]}
          />
        </TweakSection>
        <TweakSection title="Apparence">
          <TweakToggle
            label="Mode sombre"
            value={tweaks.darkMode}
            onChange={(v) => setTweak("darkMode", v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LangProvider><App /></LangProvider>);
</script>
</body>
